# Git hosts. One credential source per host (see bridge/sireum_bridge/creds.py):
#   api_key_file: /path/0600-file | api_key_env: VAR | api_key_cmd: ["gh","auth","token"]
#   github_app: {app_id: 123, private_key_file: /path/app.pem}
# Usually written by `sireum-hub add-repo`. Changes apply without a restart.
hosts: []
# Example:
# hosts:
#   - id: github
#     type: github            # github | gitlab | gitea | generic | local
#     api_url: https://api.github.com
#     git_url: https://github.com
#     api_key_file: /srv/sireum/secrets/github.key
